models:
  llama_3_1_8b:
    id: meta-llama/Llama-3.1-8B-Instruct
    chat_template: llama-3.1
    adaptation: lora
    load_in_4bit: false
  gemma_3_12b:
    id: unsloth/gemma-3-12b-it
    chat_template: gemma-3
    adaptation: lora
    load_in_4bit: false
  qwen_2_5_14b:
    id: unsloth/Qwen2.5-14B-Instruct
    chat_template: chatml
    adaptation: lora
    load_in_4bit: false
  gemma_3_27b:
    id: unsloth/gemma-3-27b-it
    chat_template: gemma-3
    adaptation: qlora
    load_in_4bit: true

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_sequence_length: 16384
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  epochs: 2
  learning_rate: 1.0e-5
  optimizer: adamw_torch
  scheduler: cosine
  warmup_steps: 20
  weight_decay: 0.01
  precision: bfloat16
  loss_masking: assistant_response_tokens_only
