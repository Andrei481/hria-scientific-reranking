[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hria-reranking"
version = "0.1.0"
description = "Reproducibility resources for scientific-document reranking"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Andrei Joldea" },
]
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
]

[project.optional-dependencies]
gpu = [
  "torch",
  "transformers",
  "accelerate",
  "peft",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["hria_reranking*"]
namespaces = true
